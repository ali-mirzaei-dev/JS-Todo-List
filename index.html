                    <i class="icon text-lg"></i>comming soon ...

    <!--==================#2 RIGHT CONTENT  ==================-->
    <!--======================================================-->
    <main class="flex flex-col content-start justify-center duration-500 **:duration-500 flex-1 min-h-screen w-full bg-bgDef text-primary">

        <!--==================#2-1 HEADER ==================-->
        <header class="flex w-full h-fit justify-between md:justify-end p-3 sticky top-0 backdrop-blur-md z-20">

            <!--=======#2-1-1 ICON LEFT  =======-->
            <i id="leftBtn" class="md:hidden text-2xl icon px-1 py-2">ﵽ</i>

            <!--=======#2-1-2 ICONS RIGHT  =======-->
            <div class="flex gap-3 md:gap-5 items-center">
                <span id="themeToggle" class="flex text-md font-medium capitalize text-secondary items-center gap-1 p-1 rounded-lg hover:bg-hover cursor-pointer">
                    <i class="icon text-2xl"></i>
                    <span class="hidden sm:inline">display</span>
                </span>
                <i class="mt-0.5 text-3xl icon cursor-pointer">ￖ</i>
            </div>
        </header>

        <!--==================#2-2 CONTENT ==================-->
        <section class="w-full flex flex-wrap content-start flex-1 relative px-4 md:px-16 lg:pl-40 lg:pr-70 gap-2 ">

            <h2 onclick="check()" class="w-full capitalize text-[32px] mt-4">Inbox</h2>

            <!--=======#2-2-1 TOOLBAR =======-->
            <div id="toolBar" class="w-full flex-col md:flex-row flex-wrap justify-between items-start md:items-center gap-4 py-2 mb-6 border-b border-border-soft hidden">

                <!-- Left btns -->
                <div class="flex items-center gap-4 md:gap-6 text-sm font-medium text-secondary capitalize">
                    <span class="flex items-center gap-1.5">
                        <i class="icon no-hover text-base cursor-default"></i>
                        Total:
                        <span id="totalCounter" class="text-primary font-bold">0</span>
                    </span>
                    <span class="flex items-center gap-1.5">
                        <i class="icon no-hover text-lg cursor-default"></i>
                        Completed:
                        <span id="completedCounter" class="text-green-700 font-bold">0</span>
                    </span>
                </div>

                <!-- Right btns -->
                <button onclick="clearCompletedTasks()" class="text-sm text-secondary hover:text-accent capitalize flex items-center gap-1 cursor-pointer transition-colors py-1 px-2 rounded-lg hover:bg-hover">
                    <i class="icon no-hover text-base"></i>
                    Clear Completed
                </button>
            </div>


            <!--=======#2-2-2 EMPTY STATE =======-->
            <div id="emptyState" class="absolute w-full max-w-sm px-4 flex flex-wrap justify-center text-center gap-3 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                <img class="max-w-xs w-full h-auto" src="assets/Images/EmptyInbox.png" alt="">
                <span class="w-full font-bold text-primary">Capture now, plan later</span>
                <span class="w-full text-secondary px-6">Inbox is your go-to spot for quick task entry. Clear your mind now, organize when you’re ready.</span>
                <button id="addTaskInEmpty" class="text-white mt-3 bg-accent py-2 px-3 rounded-lg hover:bg-red-700 duration-400 capitalize gap-1 flex items-center cursor-pointer">
                    <i class="icon text-white no-hover">ﭐ</i>
                    add task</button>
            </div>

            <!--=======#2-2-3 NEW TASKS =======-->
            <ul id="newTasksPlace" class="flex flex-wrap content-start w-full">

            </ul>

        </section>


    </main>
