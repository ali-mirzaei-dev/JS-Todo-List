<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/StyleSheet/output.css">
    <link rel="stylesheet" href="assets/Font/font/style.css">
    <link rel="stylesheet" href="assets/Font/font1/style.css">
    <link rel="stylesheet" href="assets/Font/font2/style.css">

    <!-- npx @tailwindcss/cli -i ./assets/StyleSheet/master.css -o ./assets/StyleSheet/output.css --watch -->
</head>

<body class="flex flex-wrap">

    <!--==================#1 LEFT SIDE NAV ==================-->
    <!--==================================================-->
    <nav class="hidden absolute md:static w-full md:block md:w-20/100 lg:w-15/100 h-screen duration-700 z-10 overflow-hidden">
        <section class="flex h-full flex-wrap content-start gap-4 bg-bgDef py-5 px-4 2xl:container">

            <!--==================#1-1 CLOSE SIDEBAR ICON  ==================-->
            <div class="w-full text-right">
                <i id="closeBtn" class="text-2xl icon">ﵽ</i>
            </div>

            <!--==================#1-2 SIDE MENU ==================-->
            <ul class="w-full flex flex-wrap content-start *:py-1.5 *:px-1 *:hover:bg-hover *:cursor-pointer *:capitalize *:w-full *:flex *:gap-1">
                <li><i class="icon"></i>inbox</li>
                <li><i class="icon"></i>today</li>
                <li><i class="icon"></i>upcomming</li>
                <li><i class="icon"></i>completed</li>
                <li><i class="icon"></i>setting</li>
            </ul>
        </section>
    </nav>

    <!--==================#2 RIGHT CONTENT  ==================-->
    <!--======================================================-->
    <main class="flex flex-col content-start justify-center duration-500 **:duration-500 flex-1 min-h-screen">

        <!--==================#2-1 HEADER ==================-->
        <header class="flex w-full h-fit  justify-between md:justify-end p-3">

            <!--=======#2-1-1 ICON LEFT  =======-->
            <i id="leftBtn" class="md:hidden text-2xl icon px-1 py-2">ﵽ</i>

            <!--=======#2-1-2 ICONS RIGHT  =======-->
            <div class="flex gap-5">
                <span class="flex text-md font-medium capitalize text-secondary items-center gap-1 p-1 rounded-lg hover:bg-hover cursor-pointer">
                    <i class="text-2xl icon"></i>
                    display</span>
                <i class=" mt-0.5 text-3xl icon ">ￖ</i>
            </div>
        </header>

        <!--==================#2-2 CONTENT ==================-->
        <section class="w-full flex flex-wrap content-start flex-1 relative px-60 gap-2">

            <h2 onclick="check()" class="w-full capitalize text-[32px]">Inbox</h2>

            <!--=======#2-2-1 TOOLBAR =======-->
            <div id="toolBar" class="w-full  flex-wrap justify-between items-center gap-4 py-2 mb-2 border-b border-border-soft hidden">

                <!-- Left btns -->
                <div class="flex items-center gap-6 text-sm font-medium text-secondary capitalize">
                    <span class="flex items-center gap-1.5">
                        <i class="icon no-hover text-base"></i>
                        Total: <span id="totalCounter" class="text-primary font-bold">0</span>
                    </span>
                    <span class="flex items-center gap-1.5">
                        <i class="icon no-hover text-base"></i>
                        Completed: <span id="completedCounter" class="text-accent font-bold">0</span>
                    </span>
                </div>

                <!-- Right btns -->
                <button onclick="clearCompletedTasks()" class="text-sm text-secondary hover:text-accent capitalize flex items-center gap-1.5 cursor-pointer transition-colors py-1 px-2 rounded-lg hover:bg-hover">
                    <i class="icon no-hover text-base"></i>
                    Clear Completed
                </button>
            </div>


            <!--=======#2-2-2 EMPTY STATE =======-->
            <div id="emptyState" class=" absolute w-90 flex flex-wrap justify-center text-center gap-3 top-1/2 left-1/2 -translate-x-1/2 -translate-y-50/100">
                <img class="" src="assets/Images/EmptyInbox.png" alt="">
                <span class="w-full font-bold text-primary">Capture now, plan later</span>
                <span class="w-full text-secondary px-6">Inbox is your go-to spot for quick task entry. Clear your mind now, organize when you’re ready.</span>
                <button id="addTaskInEmpty" class="text-white mt-3 bg-accent py-2 px-3 rounded-lg hover:bg-red-700 duration-400 capitalize gap-1 flex items-center cursor-pointer">
                    <i class="icon text-white no-hover">ﭐ</i>
                    add task</button>
            </div>

            <!--=======#2-2-3 NEW TASKS =======-->
            <ul id="newTasksPlace" class="flex flex-wrap content-start w-full ">

            </ul>


        </section>


    </main>

</body>
<script>

    const closeBtn = document.getElementById("closeBtn")
    const nav = document.querySelector("nav")
    const main = document.querySelector("main")
    const leftBtn = document.getElementById("leftBtn")
    const placeHolder = document.querySelector("body")



    // ------- CLOSE SIDEBAR ------- //
    closeBtn.addEventListener("click", () => {
        nav.classList.add("md:w-0!", "md:p-0!");
        nav.classList.add("swipe");

        setTimeout(() => {
            nav.classList.remove("md:block")
            leftBtn.classList.remove("md:hidden")
            leftBtn.parentElement.classList.remove("md:justify-end")
        }, 500);
    })

    // ------- OPEN SIDEBAR ------- //
    leftBtn.addEventListener("click", () => {
        leftBtn.classList.add("md:hidden")
        leftBtn.parentElement.classList.add("md:justify-end")
        nav.classList.add("md:block")
        nav.classList.remove("hidden")

        setTimeout(() => {
            nav.classList.remove("swipe");
            nav.classList.remove("md:w-0!", "md:p-0!");
        }, 500);
    })

    let tasks = []
    const emptyState = document.getElementById("emptyState")
    const addTaskInEmpty = document.getElementById("addTaskInEmpty")
    const newTasksPlace = document.getElementById("newTasksPlace")
    const toolBar = document.getElementById("toolBar")
    const totalTasksPlace = document.getElementById("totalCounter")
    const completedTaskPlace = document.getElementById("completedCounter")

    let newTaskInput
    let addNewTask
    let totalTaskCount = 0
    let isEditing = false;

    // ------- LOCAL STORAGE LOAD ------- //
    let tempTasks = JSON.parse(localStorage.getItem('dataBase'))

    if (tempTasks) {
        tasks = tempTasks
        renderTask()
        check()
        loader()
    }


    // ------- THIS GENERATES THE NEW TASK INPUT BOX ------- //
    function addTask() {
        newTaskInput = document.createElement("li")
        newTaskInput.className = "mt-1 border w-full border-gray-300 rounded-xl py-4 px-3 flex flex-wrap gap-2 *:w-full"
        newTaskInput.innerHTML = `
        
        <textarea id="inputValue" placeholder="Please write your task here!" class="border text-primary border-none resize-none focus:outline-none"></textarea>
        
        <div class="flex justify-between">
            <div class="flex gap-2 items-center">
                <i class="icon text-secondary bg-hover hover:bg-gray-300">ﭐ</i>
                
                <span class="flex items-center capitalize p-1 rounded-lg cursor-pointer hover:bg-hover text-primary">
                    <i class="icon no-hover text-secondary">ﰅ</i>
                    date
                </span>
            </div>

            <div class="flex items-center gap-2">
                <i onclick="deleteAddBox()" class="icon text-secondary text-lg"></i>
                <i onclick="submitTask()" class="icon bg-accent hover:bg-red-700 text-white">מּ</i>
            </div>
        </div>`


        newTasksPlace.appendChild(newTaskInput)
        setTimeout(() => {
            const textarea = document.getElementById("inputValue");
            if (textarea) textarea.focus();
        }, 0);


    }

    // ------- FIRST TASK ------- //
    addTaskInEmpty.addEventListener("click", () => {
        emptyState.classList.add("hidden")
        toolBar.classList.remove("hidden")
        toolBar.classList.add("flex")
        addTask()
    })

    // ------- SUBMIT TASK AND CREATING THE ARRAY AND DATABASE------- //
    function submitTask() {
        const inputValue = document.getElementById("inputValue")

        if (inputValue.value.trim() != '') {

            // ------- THIS CREATES THE OBJECTS TO ADD TO THE ARRAY
            let tempAdd = {}

            tempAdd = {
                name: inputValue.value,
                id: Date.now(),
                status: "off"
            }
            tasks.push(tempAdd);



            renderTask()
            addTask()
            check()
        }
    }

    // ------- THIS SAVES TO LOCAL STORAGE ------- //
    function saveTask() {
        localStorage.setItem('dataBase', JSON.stringify(tasks))
    }

    // ------- RENDER TASKS ------- // 
    function renderTask() {
        newTasksPlace.innerHTML = "";

        tasks.forEach((val) => {
            let addedTask = document.createElement("li");
            addedTask.className = "w-full flex justify-between border-b border-gray-300 rounded-md px-3 py-4 *:flex *:gap-2";
            addedTask.setAttribute("data-id", val.id);

            if (val.status == "on") {
                addedTask.classList.add("bg-[#f0fdf4]");
                addedTask.innerHTML = `
            <div>
                <input onchange="markComplete(this)" type="checkbox" checked class="custom-checkbox mt-0.5">
                <span class="line-through decoration-1 decoration-green-800 text-green-700">${val.name}</span>
            </div>
            <div>
                <i onclick="deleteAddedTask(this)" class="icon icon-delete"></i>
            </div>`;
            } else {

                addedTask.innerHTML = `
            <div>
                <input onchange="markComplete(this)" type="checkbox" class="custom-checkbox mt-0.5">
                <span>${val.name}</span>
            </div>
            <div>
                <i onclick="editAddedTask(this)" class="icon"></i>
                <i onclick="deleteAddedTask(this)" class="icon icon-delete"></i>
                <i class="icon">ﭏ</i>
            </div>`;
            }

            newTasksPlace.appendChild(addedTask);
        });

        addNewTask = document.createElement("div");
        addNewTask.className = "w-full flex justify-center py-4";
        addNewTask.innerHTML = `
        <button onclick="addNewTaskFunc()" class="capitalize hover:bg-hover cursor-pointer py-1 pr-2 rounded-lg">
            <i class="icon no-hover">ﭐ</i>
            add task
        </button>`;
    }

    // ------- THIS SHOWS THE ADD BTN UNDER THE TASKS ------- //
    function showAddBtn() {
        if (addNewTask && document.body.contains(addNewTask)) return;

        addNewTask = document.createElement("div");
        addNewTask.className = "w-full flex justify-center py-4";
        addNewTask.innerHTML = `
        <button onclick="addNewTaskFunc()" class="capitalize hover:bg-hover cursor-pointer py-1 pr-2 rounded-lg">
            <i class="icon no-hover">ﭐ</i>
            add task
        </button>`;
        newTasksPlace.appendChild(addNewTask);
    }

    // ------- FOR ADDING NEW TASKS WITH THE ADD BUTTON ------- //
    function addNewTaskFunc() {
        if (isEditing) { return };
        addNewTask.remove()
        addTask()
    }

    // ------- FOR REMOVING THE NEW TASK INPUT ------- //
    function deleteAddBox() {
        if (newTaskInput) newTaskInput.remove();

        if (newTasksPlace.querySelectorAll("li").length == 0) {
            emptyState.classList.remove("hidden")
            toolBar.classList.remove("flex")
            toolBar.classList.add("hidden")
        } else {
            showAddBtn();
        }
    }

    // ------- DELETING AN ADDED TASK ------- //
    function deleteAddedTask(element) {

        let deleteTaskConfirm = document.createElement("div")
        deleteTaskConfirm.className = "absolute inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
        deleteTaskConfirm.innerHTML = `
            <div class="bg-bgDef border border-hover rounded-xl p-6 w-90 max-w-sm flex flex-col gap-5 shadow-2xl">
        
                <div class="w-12 h-12 bg-accent/10 rounded-full flex items-center justify-center mx-auto">
                    <i class="icon text-2xl text-accent no-hover"></i>
                 </div>

                <div class="text-center flex flex-col gap-2">
                    <h3 class="text-lg font-bold text-primary">Delete this task?</h3>
                    <p class="text-sm text-secondary">This action cannot be undone. Are you sure you want to proceed?</p>
                </div>
               
                <div class="flex gap-3 mt-2">
                    <button id="cancelDelete" class="flex-1 py-2 rounded-lg border border-hover text-primary text-sm font-bold uppercase tracking-wider hover:bg-hover transition-colors cursor-pointer">
                    Cancel
                    </button>

                    <button id="confirmDelete" class="flex-1 py-2 rounded-lg bg-accent text-white text-sm font-bold uppercase tracking-wider hover:bg-red-700 transition-colors cursor-pointer">
                    Delete
                    </button>

                </div>
            </div>`

        placeHolder.appendChild(deleteTaskConfirm)

        const cancelDelete = document.getElementById("cancelDelete")
        const confirmDelete = document.getElementById("confirmDelete")

        cancelDelete.addEventListener("click", () => {
            deleteTaskConfirm.remove()
        })
        confirmDelete.addEventListener("click", () => {
            element.parentElement.parentElement.remove()
            deleteTaskConfirm.remove()

            // ------- DELETEING FROM ARRAY 
            const taskToDelete = +element.parentElement.parentElement.getAttribute("data-id")

            tasks.forEach((val, i) => {
                if (val.id === taskToDelete) {
                    {
                        tasks.splice(i, 1)
                    }
                }
            })
            check()
        })

        deleteTaskConfirm.addEventListener("click", (e) => {
            if (e.target === deleteTaskConfirm) {
                deleteTaskConfirm.remove();
            }
        });
    }


    // ------- EDITING AN ADDED TASK ------- //


    function editAddedTask(element) {
        if (isEditing) { return };
        isEditing = true;

        const tempValAdded = element.parentElement.parentElement.querySelector("span")
        const tempValEditId = element.parentElement.parentElement.getAttribute("data-id")

        // ------- CREATING THE EDITING BOX
        let editAddedTaskInput = document.createElement("li")
        editAddedTaskInput.className = "mt-1 border w-full border-gray-300 rounded-xl py-4 px-3 flex flex-wrap gap-2 *:w-full"
        editAddedTaskInput.innerHTML = `
        <textarea placeholder="Please write your task here!" class="border text-primary border-none resize-none focus:outline-none">${tempValAdded.innerText}</textarea>
        <div class="flex justify-end gap-2">
            <i id="editCancel" class="icon text-secondary text-lg"></i>
            <i id="editOkay" class="icon bg-accent hover:bg-red-700 text-white">מּ</i>
            </div>`


        // ------- EXECUTAIONS
        deleteAddBox()

        element.parentElement.parentElement.before(editAddedTaskInput)
        setTimeout(() => {
            editAddedTaskInput.querySelector("textarea").focus();
        }, 0);
        element.parentElement.parentElement.classList.add("hidden")

        document.getElementById("editOkay").addEventListener("click", () => {
            let newText = editAddedTaskInput.querySelector("textarea").value;

            if (newText.trim() != "") {
                tempValAdded.innerText = newText;
                tasks.forEach((val, i) => {
                    if (val.id == tempValEditId) {
                        val.name = newText
                    }
                })

                element.parentElement.parentElement.classList.remove("hidden");
                editAddedTaskInput.remove();
                isEditing = false;
                check()
            } else {
                element.parentElement.parentElement.classList.remove("hidden");
                editAddedTaskInput.remove();
                isEditing = false;
            }
        })

        document.getElementById("editCancel").addEventListener("click", () => {
            element.parentElement.parentElement.classList.remove("hidden")
            editAddedTaskInput.remove();
            isEditing = false;
        })

    }

    // ------- MARKING TASKS AS COMPLETED ------- //
    function markComplete(element) {

        const iconForRemove = element.parentElement.nextElementSibling.querySelectorAll("i")

        element.parentElement.parentElement.classList.toggle("bg-[#f0fdf4]", element.checked)
        element.nextElementSibling.classList.toggle("line-through", element.checked)
        element.nextElementSibling.classList.toggle("decoration-1", element.checked)
        element.nextElementSibling.classList.toggle("decoration-green-800", element.checked)
        element.nextElementSibling.classList.toggle("text-green-700", element.checked)

        iconForRemove.forEach((val) => {
            if (!val.classList.contains("icon-delete")) {
                val.classList.toggle("hidden", element.checked)
            }
        });

        let tempMarkId = +element.parentElement.parentElement.getAttribute("data-id")

        tasks.forEach((val, i) => {

            if (val.id === tempMarkId && val.status == "off") {
                val.status = "on"
            } else if (val.id === tempMarkId && val.status == "on") {
                val.status = "off"
            }


        })

        check()
    }

    // ------- TASKS COUNTER || CHECK() ------- //



    function check() {

        totalTaskCount = tasks.length
        let completeTaskCount = 0

        if (tasks.length > 0) {
            tasks.forEach((val) => {
                if (val.status == "on") {
                    completeTaskCount++
                }
            })
        } else {
            emptyState.classList.remove("hidden")
            if (newTaskInput) newTaskInput.remove();
            toolBar.classList.remove("flex")
            toolBar.classList.add("hidden")
        }

        totalTasksPlace.innerText = totalTaskCount
        completedTaskPlace.innerText = completeTaskCount
        saveTask()
    }

    // ------- CLEAR COMPLETE TASKS ------- //
    function clearCompletedTasks() {

        if (tasks.length > 0) {
            tasks = tasks.filter((task) => task.status !== "on");
            renderTask()
            addNewTaskFunc()
            check()
        }
    }

    function loader() {
        if (tasks.length > 0) {
            emptyState.classList.add("hidden")
            toolBar.classList.add("flex")
            toolBar.classList.remove("hidden")
            showAddBtn()
        }
    }

</script>

</html>
